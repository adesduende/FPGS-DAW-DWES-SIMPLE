  services:
    web:
      build: 
        dockerfile: ./apache.Dockerfile
      ports:
        - "80:80"
      depends_on:
        - db
      networks:
        - app-network
      environment:
        DB_HOST: db
        DB_PORT: ${DB_PORT}
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}

    db:
      build:
        dockerfile: ./mysql.Dockerfile
      ports:
        - "${DB_PORT}:3306"
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        MYSQL_DATABASE: ${DB_NAME}
        MYSQL_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db-data:/var/lib/mysql
      networks:
        - app-network
  volumes:
    db-data:
      driver: local
  networks:
    app-network:
      driver: bridge